<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Mamá 💖</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#ffcad4,#ffe5ec,#ffc2d1);
      overflow-x:hidden;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      text-align:center;
      padding:20px;
      width:100%;
      max-width:900px;
    }

    .card{
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius:25px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation: aparecer 1s ease;
    }

    h1{
      font-size:3rem;
      margin-bottom:15px;
      animation: latido 2s infinite;
    }

    p{
      font-size:1.2rem;
      line-height:1.7;
    }

    button{
      margin-top:25px;
      padding:15px 35px;
      border:none;
      border-radius:50px;
      background:white;
      color:#ff4d88;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      transform:scale(1.08);
    }

    .hidden{
      display:none;
    }

    .gallery{
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .photo{
      background:white;
      padding:10px;
      border-radius:20px;
      transform:rotate(-2deg);
      transition:0.3s;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .photo:hover{
      transform:scale(1.05) rotate(0deg);
    }

    .photo img{
      width:100%;
      border-radius:15px;
      height:240px;
      object-fit:cover;
    }

    .message-box{
      margin-top:30px;
      background: rgba(255,255,255,0.2);
      padding:20px;
      border-radius:20px;
      min-height:120px;
      font-size:1.1rem;
      animation: aparecer 1s ease;
    }

    .heart{
      position:fixed;
      color:white;
      font-size:20px;
      animation: subir 5s linear forwards;
      pointer-events:none;
    }

    @keyframes subir{
      0%{
        transform:translateY(0) scale(0.5);
        opacity:1;
      }
      100%{
        transform:translateY(-100vh) scale(1.5);
        opacity:0;
      }
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes latido{
      0%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.05);
      }
      100%{
        transform:scale(1);
      }
    }

    .final-message{
      margin-top:30px;
      font-size:1.4rem;
      font-weight:bold;
      animation: aparecer 2s ease;
    }

    audio{
      display:none;
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="card" id="inicio">

      <h1>💖 Feliz Día Mamá 💖</h1>

      <p>
        Hice esta pequeña sorpresa para ti ✨
      </p>

      <button onclick="mostrarSorpresa()">
        Abrir sorpresa 🎁
      </button>

    </div>


    <div class="card hidden" id="contenido">

      <h1>🌸 Para la mejor mamá 🌸</h1>

      <p>
        Gracias por todo lo que haces cada día.
        Por tu paciencia, cariño y apoyo 💕
      </p>


      <div class="gallery">

        <div class="photo">
          <img src="Foto1.jpeg">
        </div>

        <div class="photo">
          <img src="foto2.jpeg">
        </div>

        <div class="photo">
          <img src="foto3.jpeg">
        </div>

        <div class="photo">
            <img src="foto4.jpeg">
          </div>
  
          <div class="photo">
            <img src="foto5.jpeg">
          </div>
  
          <div class="photo">
            <img src="Foto6.png">
          </div>

          <div class="photo">
            <img src="foto7.jpg">
          </div>

      </div>


      <button onclick="mostrarMensaje()">
        Ver mensaje secreto 💌
        <p>
            (Has click varias veces)
          </p>
         
      </button>


      <div class="message-box hidden" id="mensaje">
      </div>


      <div class="final-message hidden" id="final">
        Te quiero muchísimo 💖
      </div>

    </div>

  </div>


  <audio id="music" autoplay loop>
    <source src="Cancion.mp3" type="audio/mp3">
  </audio>


  <script>

    const mensajes = [
      "Gracias por estar siempre conmigo 💕",
      "Eres la persona más importante de mi vida 🌸",
      "Gracias por cada consejo y cada abrazo ✨",
      "Tu cariño hace todo mejor 💖",
      "Siempre voy a admirarte muchísimo 🌷"
    ];


    function mostrarSorpresa(){

      document.getElementById("inicio").classList.add("hidden");
      document.getElementById("contenido").classList.remove("hidden");

      crearCorazones();

      const music = document.getElementById("music");
      music.play();
    }


    function mostrarMensaje(){

      const box = document.getElementById("mensaje");
      const final = document.getElementById("final");

      const random = mensajes[Math.floor(Math.random()*mensajes.length)];

      box.innerHTML = random;
      box.classList.remove("hidden");

      setTimeout(()=>{
        final.classList.remove("hidden");
      },2000);
    }


    function crearCorazones(){

      setInterval(()=>{

        const heart = document.createElement("div");

        heart.classList.add("heart");
        heart.innerHTML = "💖";

        heart.style.left = Math.random()*100 + "vw";
        heart.style.bottom = "0";
        heart.style.fontSize = (Math.random()*20 + 15) + "px";

        document.body.appendChild(heart);

        setTimeout(()=>{
          heart.remove();
        },5000);

      },300);
    }

  </script>

</body>
</html>
